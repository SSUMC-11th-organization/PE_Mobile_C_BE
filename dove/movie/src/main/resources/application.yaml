spring:
  datasource:
    url: jdbc:mysql://localhost:3306/umc_movie
    username: root
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

jwt:
  secret: ${JWT_SECRET} # 서명에 쓸 비밀키 (32자 이상). 실행 설정의 환경변수에서 주입
  access-expiration: ${JWT_ACCESS_EXPIRATION} # 토큰 유효시간(초)
